# Continuous Integration: validates every pull request into main BEFORE it can be merged.
# Builds the whole project into an isolated schema ci_development.pr_<PR number>,
# authenticated as the Databricks service principal (no personal token).
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing_dbt
    env:
      DBT_TARGET: ci
      DBT_PROFILES_DIR: .
      DEV_SCHEMA: pr_${{ github.event.pull_request.number }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DBX_CLIENT_ID: ${{ secrets.DBX_CLIENT_ID }}
      DBX_CLIENT_SECRET: ${{ secrets.DBX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marketing_dbt/requirements.txt

      - name: Install dbt + Elementary
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Check connection (service principal)
        run: dbt debug

      - name: Build + test everything
        # --full-refresh: each PR run rebuilds from scratch, so changed incremental
        # logic is always tested against the full history.
        run: dbt build --full-refresh

      - name: Generate static docs
        run: dbt docs generate --static

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-ci
          path: marketing_dbt/target/static_index.html
