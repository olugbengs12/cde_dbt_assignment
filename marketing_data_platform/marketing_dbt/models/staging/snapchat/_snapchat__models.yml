version: 2

models:
  - name: stg_snapchat__ad_stats
    description: Cleaned daily Snapchat ad performance. **Grain:** one row per ad per day per country.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ad_id, date_day, country_code]
    columns:
      - name: ad_id
        description: Snapchat ad identifier (source column ad_detail_id).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_snapchat__ads')
                field: ad_id
      - name: currency_code
        description: Currency the spend is reported in.
        data_tests: [not_null]
      - name: date_day
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]

  - name: stg_snapchat__ads
    description: Snapchat ads. **Grain:** one row per ad.
    columns:
      - name: ad_id
        data_tests: [unique, not_null]

  - name: stg_snapchat__ad_groups
    description: Snapchat ad groups, deduplicated to the latest version. **Grain:** one row per ad group.
    columns:
      - name: ad_group_id
        data_tests: [unique, not_null]

  - name: stg_snapchat__campaigns
    description: Snapchat campaigns. **Grain:** one row per campaign.
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
